<!doctype html>
<html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="referrer" content="no-referrer"><title>Пароль · Академия MOJO</title>
<style>body{margin:0;background:#F8FAF6;color:#233F34;font:17px system-ui}main{max-width:420px;margin:8vh auto;padding:24px}form{background:white;padding:24px;border:1px solid #E6EDE8;border-radius:24px}h1{font-size:28px}label{display:block;margin:18px 0}input{box-sizing:border-box;width:100%;font:inherit;padding:14px;margin-top:8px;border:1px solid #bdcbbf;border-radius:12px}button,a{font:inherit}button{width:100%;padding:16px;background:#233F34;color:white;border:0;border-radius:12px}button:disabled{opacity:.5}p{line-height:1.5}#status{overflow-wrap:anywhere}a{color:#233F34}</style>
<main><p>Академия сервиса MOJO</p><h1>Установить пароль</h1><p>Для входа в твой существующий аккаунт без Telegram. Курсы и прогресс сохраняются.</p>
<form id="setup"><label>Новый пароль<input id="password" name="password" type="password" autocomplete="new-password" minlength="12" maxlength="128" required></label><label>Повтори пароль<input id="repeat" name="repeat" type="password" autocomplete="new-password" minlength="12" maxlength="128" required></label><p>От 12 до 128 символов.</p><button id="submit">Сохранить пароль</button></form><p id="status" role="status" aria-live="polite"></p><a id="login" href="/pilot/" hidden>Перейти ко входу →</a></main>
<script>
const token=location.hash.slice(1);history.replaceState(null,'',location.pathname);
const form=document.getElementById('setup'), status=document.getElementById('status'), button=document.getElementById('submit');
if(!token){form.hidden=true;status.textContent='Открой персональную одноразовую ссылку настройки пароля.';}
form.addEventListener('submit',async e=>{e.preventDefault();const password=document.getElementById('password'),repeat=document.getElementById('repeat');
if(password.value!==repeat.value){status.textContent='Пароли не совпадают.';return;}
button.disabled=true;status.textContent='Сохраняем…';
try{const response=await fetch('/api/browser/setup-password',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token,password:password.value})});
const data=await response.json();if(!response.ok)throw new Error(typeof data.detail==='string'?data.detail:'Не удалось сохранить пароль.');
password.value='';repeat.value='';form.hidden=true;status.textContent='Пароль сохранён. Твой номер сотрудника: '+data.staff_id+'. Используй его и новый пароль для входа.';document.getElementById('login').hidden=false;
}catch(error){status.textContent=error.message==='Failed to fetch'?'Нет соединения. Попробуй ещё раз.':error.message;}finally{button.disabled=false;}});
</script></html>
