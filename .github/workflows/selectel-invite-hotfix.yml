name: Selectel invitation hotfix access
on:
  push:
    branches: [fix/invite-loading-20261112]
    paths: [.github/workflows/selectel-invite-hotfix.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  access:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Check configured Selectel deployment access
        env:
          DEPLOY_KEY: ${{ secrets.SELECTEL_SSH_KEY || secrets.SELECTEL_SSH_PRIVATE_KEY || secrets.VPS_SSH_KEY || secrets.SSH_PRIVATE_KEY || secrets.SSH_KEY }}
          DEPLOY_USER: ${{ secrets.SELECTEL_SSH_USER || secrets.SSH_USER || 'root' }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$DEPLOY_KEY" ]; then
            echo "::error::No Selectel SSH key configured under SELECTEL_SSH_KEY, SELECTEL_SSH_PRIVATE_KEY, VPS_SSH_KEY, SSH_PRIVATE_KEY or SSH_KEY. Deployment cannot connect to VPS."
            exit 1
          fi
          install -d -m 700 ~/.ssh
          umask 077
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/selectel
          printf '%s\n' '139.100.239.232 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIIvBSQNJ1anX5NxO1ZhKEB9GoF1Tga84d13OMLXmGBP2' > ~/.ssh/known_hosts
          ssh -i ~/.ssh/selectel -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15 "$DEPLOY_USER@139.100.239.232" 'cd /opt/service && git status --short && git rev-parse HEAD && docker inspect --format "{{.State.Status}}" service-academy-api && docker exec service-academy-api test -f /app/pilot.js'
